server:
  port: 8080

spring:
  main:
    web-application-type: reactive

  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Auth Service
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # User Service (Public APIs)
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        # User Service (Internal APIs)
        - id: user-internal-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/internal/users/**

        # Product Service
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

        # Order Service (Keep this for future)
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        # Payment Service (Keep this for future)
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        # Notification Service (Keep this for future)
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**


jwt:
  secret: MySuperSecretKeyForJwtTokenGeneration123456

logging:
  level:
    org.springframework.security: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
   tracing:
     endpoint: http://zipkin:9411/api/v2/spans

  endpoints:
    web:
     exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
